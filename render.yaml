services:
  - type: web
    name: ai-resume-optimizer
    runtime: node
    plan: free
    buildCommand: npm install && npm run deploy:build
    startCommand: npm run server:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
